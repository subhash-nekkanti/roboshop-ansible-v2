- name: copy mongodb repo files
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb serever
  package: 
    name: mongodb-org 
    state: present

- name: start and enable mongodb
  service:
    name: mongod
    state: started
    enabled: yes
  
- name: allow remote connections
  replace:
    path: /etc/mongod.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'

- name: restart mongodb
  service:
    name: mongod
    state: restarted
