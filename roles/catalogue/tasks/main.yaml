- name: application setup
  include_role: 
    name: common
    tasks_from: app-setup
    
- name: include node js setup
  include_role: 
    name: common
    tasks_from: nodejs

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd-setup

- name: copy mongo repo
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb client_token
  dnf:
    name: mongodb-mongosh
    state: present 

- name: check whether products loaded or not 
  command: mongosh --host {{ mongodb_host }} --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_count

- name: print product count
  debug: 
    msg: "{{ product_count }}"

- name: Load products
  shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
  when: product_count.stdout | int == 0   #stdout is in string so we cant match string with int so it skips.... so change stdout to int before comparing 

- name: reload and restart application
  include_role:
    name: common
    tasks_from: restart