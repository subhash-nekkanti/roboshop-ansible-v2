- name: application setup
  include_role:
    name: common
    tasks_from: app-setup

- name: install mysql client
  package:
    name: mysql
    state: present

- name: include java setup
  include_role:
    name: common
    tasks_from: java

- name: load mysql data
  include_role:
    name: mysql-data

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd-setup

- name: restart application
  include_role:
    name: common
    tasks_from: restart

