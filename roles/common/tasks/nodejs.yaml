- name: disable nodejs
  command: dnf module disable nodejs -y

- name: enable nodejs 24
  command: dnf module enable nodejs:24 -y

- name: install node js 24
  dnf:   #when we already know its dnf we can directly use dnf: module. ansible directly executed without searching for os(like dnf for redhat ...etc)
    name: nodejs 
    state: present
    
- name: install nodejs dependencies network_performance_options
  community.general.npm:
    path: /app