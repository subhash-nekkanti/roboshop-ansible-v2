- name: configure systemd service 
  template:  
    src: "{{ component }}.service.j2"
    dest: /etc/systemd/system/{{ component }}.service

- name: deamon reload
  systemd_service:
    daemon_reload: yes

- name: start and enable {{ component }}
  service:
    name: "{{ component }}"
    state: restarted
    enabled: yes