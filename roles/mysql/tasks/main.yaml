- name: enable mysql 8.4
  command:
    dnf module enable mysql:8.4 -y
  
- name: install mysql server
  package:
    name: mysql-server
    state: present

- name: enable and start mysql
  service:
    name: mysqld
    state: started
    enabled: yes

